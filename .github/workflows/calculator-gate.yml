name: Calculator release gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculator-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Same stages, 58 tests, workers and timeouts; add progress-only reporters.
      - run: npm run data:check && npm run test:unit && npm run build && GIDPS_PREBUILT=1 npm run test:e2e:calculator -- --reporter=line,./scripts/calculator-progress-reporter.mjs
      - name: Preserve sanitized calculator progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/calculator-progress/events.ndjson
          if-no-files-found: warn
          retention-days: 7
