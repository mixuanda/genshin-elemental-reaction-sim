name: Calculator release gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculator-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:check && npm run test:unit

  calculator-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Retain the calculator suite and include the strict cross-runtime replay
      # cases. Per-test limits and the existing 20-minute job limit are intact.
      - run: GIDPS_PREBUILT=1 npm run test:e2e:calculator -- apps/web/e2e/angular-geometry-replay.spec.ts --workers=1 --reporter=line,./scripts/calculator-progress-reporter.mjs
      - name: Preserve sanitized calculator progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/calculator-progress/events.ndjson
          if-no-files-found: warn
          retention-days: 7

  calculator-contract:
    if: always()
    needs: [calculator-unit, calculator-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require both complete validation jobs
        env:
          UNIT_RESULT: ${{ needs.calculator-unit.result }}
          BROWSER_RESULT: ${{ needs.calculator-browser.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$BROWSER_RESULT" = success
